services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: karven
      POSTGRES_USER: karven
      POSTGRES_PASSWORD: karven-dev-password
    ports:
      - "5432:5432"
    volumes:
      - karven_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U karven -d karven"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - karven_redis:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://karven:karven-dev-password@postgres:5432/karven
      REDIS_URL: redis://redis:6379
      KARVEN_JWT_SECRET: local-karven-jwt-secret-0123456789-0123456789
      KARVEN_ADMIN_API_KEY: local-karven-admin-key-0123456789-0123456789
      KARVEN_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      KARVEN_APP_URL: http://localhost:5173
      KARVEN_RUN_WORKER: "true"
    ports:
      - "3000:3000"
    command: sh -c "node src/migrate.js && node src/server.js"

volumes:
  karven_pg:
  karven_redis:
